version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: pnpm
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        versions: ['>=6.1.0'] # Revisit when typescript-eslint supports it.
      - dependency-name: eslint
        versions: ['>=10.0.0'] # Revisit when all Next ESLint plugins support it.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
