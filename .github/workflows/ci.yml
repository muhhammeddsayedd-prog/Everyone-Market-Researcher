name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: node --test scripts/check-secrets.test.mjs
      - run: pnpm check:secrets

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - name: Check credential-free seed TLS regressions
        run: node --test scripts/seed/check-tls.test.mjs scripts/seed/prod-check-tls.test.mjs
      - name: Check bounded YouTube response diagnostics
        run: node --test scripts/seed/diagnose-youtube.test.mjs
      - name: Check native n8n foundation and read-only API contracts
        run: node --test n8n/foundation/*.test.mjs scripts/n8n/inventory.test.mjs scripts/n8n/inventory-diagnostics.test.mjs scripts/n8n/check-dns.test.mjs
      - name: Check bounded GW-01 trial and private delivery contracts
        run: node --test scripts/n8n/gw01-trial.test.mjs scripts/n8n/gw01-delivery.test.mjs scripts/n8n/gw01-delivery-transport.test.mjs scripts/n8n/gw01-privacy-read.test.mjs scripts/n8n/gw01-writer.test.mjs scripts/n8n/gw01-gateway-transport.test.mjs scripts/n8n/gw01-gateway-logs.test.mjs scripts/n8n/gw01-log-read.test.mjs

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.121.0
      - name: Check database script safety regressions
        run: node --test scripts/db/check-pooler.test.mjs
      - name: Start isolated local stack, replay migrations, test and run advisors
        run: bash scripts/db/run-local-ci.sh
      - name: Verify local Data API exposure
        run: node scripts/db/check-data-api.mjs
      - name: Verify concurrent collector claims and deduplication
        run: node scripts/db/check-concurrency.mjs
      - name: Verify M03 keyed cost concurrency
        run: |
          node --test scripts/db/check-m03-concurrency.test.mjs
          node scripts/db/check-m03-concurrency.mjs
      - name: Verify isolated GW-01 admission and interrupted-write concurrency
        run: |
          node --test scripts/db/check-gw01-concurrency.test.mjs
          node scripts/db/check-gw01-concurrency.mjs --local
